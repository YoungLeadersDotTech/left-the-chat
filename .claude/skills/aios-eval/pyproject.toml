[project]
name = "aios-eval"
version = "0.1.0"
description = "Deterministic validators for the aios-eval plugin"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["validators"]
omit = ["tests/*"]
